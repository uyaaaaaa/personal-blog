name: Changes
description: 記事以外のファイルが変わったかを見る

outputs:
    code:
        description: 記事以外のファイルが変わっていれば true
        value: ${{ steps.detect.outputs.code }}

runs:
    using: composite
    steps:
        - id: detect
          shell: bash
          env:
              PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
              PUSH_BASE: ${{ github.event.before }}
          run: |
              base="${PULL_REQUEST_BASE:-$PUSH_BASE}"
              if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
                  echo 'code=true' >> "$GITHUB_OUTPUT"
                  exit 0
              fi

              status=0
              node scripts/touches-code.mjs "$base" HEAD || status=$?
              case "$status" in
                  0) echo 'code=true' >> "$GITHUB_OUTPUT" ;;
                  2) echo 'code=false' >> "$GITHUB_OUTPUT" ;;
                  *) exit "$status" ;;
              esac
