name: Changes

on:
    workflow_call:
        outputs:
            code:
                description: 記事以外のファイルが変わっていれば true
                value: ${{ jobs.detect.outputs.code }}

permissions:
    contents: read

jobs:
    detect:
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.detect.outputs.code }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - id: detect
              env:
                  PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
                  PUSH_BASE: ${{ github.event.before }}
              run: |
                  base="${PULL_REQUEST_BASE:-$PUSH_BASE}"
                  # workflow_dispatch と force push には比べる相手がいない
                  if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
                      echo 'code=true' >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  status=0
                  node scripts/touches-code.mjs "$base" HEAD || status=$?
                  case "$status" in
                      0) echo 'code=true' >> "$GITHUB_OUTPUT" ;;
                      2) echo 'code=false' >> "$GITHUB_OUTPUT" ;;
                      *) exit "$status" ;;
                  esac
