name: Lint

on:
    pull_request:
        paths-ignore: ['content/**']
    push:
        branches: [main]
        paths-ignore: ['content/**']
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: lint-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npm run lint:code
