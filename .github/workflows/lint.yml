name: Lint

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: lint-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: ./.github/actions/changes
              id: changes
            - if: steps.changes.outputs.code != 'false'
              uses: ./.github/actions/setup
            - if: steps.changes.outputs.code != 'false'
              run: npm run lint:code
