name: Review

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:
        inputs:
            pr:
                description: PR の番号
                required: true

concurrency:
    group: review-${{ github.event.pull_request.number || inputs.pr }}
    cancel-in-progress: true

jobs:
    review:
        if: ${{ !github.event.pull_request.draft }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
            checks: read
        env:
            PR: ${{ github.event.pull_request.number || inputs.pr }}
            REPO: ${{ github.repository }}
            MAX_REVIEWS: 5
        steps:
            - id: key
              run: |
                  if [ -n "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then
                      echo "ok=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::ANTHROPIC_API_KEY も CLAUDE_CODE_OAUTH_TOKEN も無いので、レビューしない"
                  fi
              env:
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

            - if: steps.key.outputs.ok
              uses: actions/create-github-app-token@v3
              id: token
              with:
                  client-id: ${{ secrets.REVIEW_APP_CLIENT_ID }}
                  private-key: ${{ secrets.REVIEW_APP_KEY }}

            - if: steps.key.outputs.ok
              id: rounds
              run: |
                  done=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
                      --jq "[.[] | select(.user.login == \"$BOT[bot]\")] | length" | awk '{ n += $1 } END { print n + 0 }')
                  if [ "$done" -lt "$MAX_REVIEWS" ]; then
                      echo "go=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::この PR へのレビューが ${MAX_REVIEWS} 回に達した"
                  fi
              env:
                  GH_TOKEN: ${{ github.token }}
                  BOT: ${{ steps.token.outputs.app-slug }}

            - if: steps.rounds.outputs.go
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - if: steps.rounds.outputs.go
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            - if: steps.rounds.outputs.go
              run: |
                  npm install -g @anthropic-ai/claude-code
                  claude -p "PR #$PR をレビューする" \
                      --agent review \
                      --allowedTools "Bash(git:*) Bash(gh:*) Bash(cat:*) Bash(node scripts/review-args.mjs:*) Read Grep Glob" \
                      --settings '{"disableAllHooks": true}'
                  test -s "$REVIEW_OUT"
              env:
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  GH_TOKEN: ${{ github.token }}
                  REVIEW_OUT: ${{ runner.temp }}/review.json

            - if: steps.rounds.outputs.go
              run: gh api --method POST "repos/$REPO/pulls/$PR/reviews" --input "$REVIEW_OUT"
              env:
                  GH_TOKEN: ${{ steps.token.outputs.token }}
                  REVIEW_OUT: ${{ runner.temp }}/review.json
