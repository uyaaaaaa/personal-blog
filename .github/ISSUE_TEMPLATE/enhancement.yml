name: 改善
description: 機能・仕組みを足す、変える
labels: [enhancement]
body:
    - type: markdown
      attributes:
          value: |
              - タイトルは1行の言い切り。分類の接頭辞は付けない
              - 本文40行以内、1節3項目以内、1項目1行
    - type: textarea
      id: goal
      attributes:
          label: ゴール
          description: 何がどうなってほしいか
      validations:
          required: true
    - type: textarea
      id: current
      attributes:
          label: 現状
          description: 今の振る舞い・該当箇所・困っていること
      validations:
          required: true
    - type: textarea
      id: done
      attributes:
          label: 完了条件
          description: 満たしたかを外から判定できる状態
          value: '- [ ] '
      validations:
          required: true
    - type: textarea
      id: constraints
      attributes:
          label: 前提・制約
          description: 触らないもの、既にある判断へのリンク
    - type: textarea
      id: hints
      attributes:
          label: 手がかり
          description: 読む場所と観測した事実
    - type: textarea
      id: out-of-scope
      attributes:
          label: 範囲外
          description: 今回やらないこと
