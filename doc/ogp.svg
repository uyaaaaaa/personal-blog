<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Tech Blog</title>
  <desc>Open Graph 用のデフォルト画像。生成手順は doc/ICON_GUIDELINE.md を参照。</desc>

  <defs>
    <style>
      /* サブセット化した JetBrains Mono を埋め込み、環境に依存せず同じ絵が出るようにしている */
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 700;
        src: url(data:font/woff2;base64,) format('woff2');
      }
    </style>
  </defs>

  <!-- 地とヘッダー帯（サイトの追従ヘッダーを再現している） -->
  <rect width="1200" height="630" fill="#F9F9F9"/>
  <rect width="1200" height="150" fill="#FFFFFF"/>
  <rect y="148" width="1200" height="2" fill="#E5E5E5"/>
  <rect width="14" height="630" fill="#8B5CF6"/>

  <!-- ヘッダーのロゴロックアップ -->
  <g transform="translate(110 45) scale(1.875)">
    <rect width="32" height="32" rx="7" fill="#1A1A1A"/>
    <path d="M8.5 10.5 v6.2 a4.6 4.6 0 0 0 9.2 0 v-6.2" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M17.7 10.5 v11" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="26" y1="9.5" x2="22.4" y2="22.5" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="188" y="105" font-family="JetBrains Mono, monospace" font-size="40" font-weight="700"
        letter-spacing="-1" fill="#1A1A1A">Tech Blog</text>

  <!-- 本文 -->
  <text x="110" y="330" font-family="JetBrains Mono, monospace" font-size="72" font-weight="700"
        letter-spacing="-2" fill="#1A1A1A">Functional Minimalism</text>
  <text x="110" y="426" font-family="JetBrains Mono, monospace" font-size="72" font-weight="700"
        letter-spacing="-2" fill="#8B5CF6">for Experts</text>
  <text x="110" y="516" font-family="JetBrains Mono, monospace" font-size="26" font-weight="400"
        fill="#888888">software engineering / architecture / design</text>
</svg>
